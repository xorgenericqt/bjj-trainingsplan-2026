# SlowMovie-Konfiguration — Geschenk-Setup (S/W-Display, 1 Bildwechsel pro Tag)
# Nach ~/SlowMovie/slowmovie.conf kopieren, dann: sudo systemctl restart slowmovie

# Waveshare 7,5" V2 (800x480, Schwarz/Weiss)
epd = waveshare_epd.epd7in5_V2

# 1 Bildwechsel pro Tag (86400 s) ...
delay = 86400

# ... dabei 1440 Frames weiter = 1 Filmminute pro Tag (bei 24 fps).
# Ein 2-Stunden-Film laeuft damit ca. 4 Monate.
increment = 1440

# Bild auf volle Displayflaeche skalieren
fullscreen = True

# Zum TESTEN die beiden Zeilen oben ersetzen durch:
#   delay = 30
#   increment = 4
